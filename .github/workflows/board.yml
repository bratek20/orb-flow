name: board

# Rebuilds the trade board from GGG's public exchange feed every hour and publishes it with GitHub Pages.
on:
  schedule:
    - cron: "25 * * * *"   # GGG publishes each hour ~1-1.5 h late
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore database (keeps already downloaded hours)
        uses: actions/cache@v4
        with:
          path: data/orbflow.db
          key: board-db-${{ github.run_id }}
          restore-keys: board-db-
      - name: Build board
        run: python -m orbflow.board --collect --hours 24
      - name: Prepare site
        run: |
          mkdir -p site
          cp reports/board.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
